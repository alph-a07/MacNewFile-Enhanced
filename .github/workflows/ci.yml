name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify Test Suite
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version 2>/dev/null || true
          swift --version

      - name: Build MacNewFile & Finder Extension
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Run Full Automated Test Sweep
        run: |
          swift tests/run_full_test_sweep.swift

      - name: Archive Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacNewFile-macOS
          path: dist/MacNewFile.zip
          retention-days: 14
